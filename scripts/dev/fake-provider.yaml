# A stand-in model provider for the kind development cluster: it speaks
# just enough of the OpenAI chat-completions SSE protocol to drive a
# stirrup run without a real API key or any egress from the cluster.
#
# It drives the same four-turn run every time, picking each turn by how
# many tool results the conversation already carries: search_memory,
# save_memory, run_command in the sandbox, then a final message quoting
# the search result back. One run therefore exercises both
# control-plane memory tools and pods/exec inside a sandbox Pod.
#
# Development only. Point a profile's provider at
# http://fake-provider.hairpin.svc:8080/v1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-provider
  namespace: hairpin
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    PROBE = "uname -sm; id; echo sandbox-ok"

    def chunk(delta, finish=None):
        return {
            "id": "fake-1",
            "object": "chat.completion.chunk",
            "model": "fake-model",
            "choices": [{"index": 0, "delta": delta, "finish_reason": finish}],
        }

    def tool_call_turn(call_id, name, arguments):
        return [
            chunk({"role": "assistant", "content": ""}),
            chunk({"tool_calls": [{
                "index": 0,
                "id": call_id,
                "type": "function",
                "function": {"name": name, "arguments": json.dumps(arguments)},
            }]}),
            chunk({}, "tool_calls"),
        ]

    def final_turn(text):
        return [
            chunk({"role": "assistant", "content": ""}),
            chunk({"content": text}),
            chunk({}, "stop"),
        ]

    def text_of(content):
        """Flatten a message's content, which may be a string or parts."""
        if isinstance(content, str):
            return content
        if isinstance(content, list):
            return "".join(
                p.get("text", "") for p in content if isinstance(p, dict)
            )
        return ""

    def tool_results(messages):
        return [m for m in messages if m.get("role") == "tool"]

    def prompt_of(messages):
        for m in messages:
            if m.get("role") == "user":
                return text_of(m.get("content"))
        return ""

    def turn(messages):
        results = tool_results(messages)
        prompt = prompt_of(messages)
        if not results:
            return tool_call_turn(
                "call_search", "search_memory", {"query": prompt})
        if len(results) == 1:
            return tool_call_turn(
                "call_save", "save_memory",
                {"content": "Learned: " + prompt, "kind": "fact"})
        if len(results) == 2:
            return tool_call_turn(
                "call_probe", "run_command", {"command": PROBE, "timeout": 30})
        # The first result is the search: quoting it makes what an
        # earlier run saved observable in the job's final text.
        return final_turn(
            "Sandbox probe complete. Recalled: "
            + text_of(results[0].get("content")))

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def log_message(self, fmt, *args):
            print("fake-provider: " + fmt % args, flush=True)

        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
            request = json.loads(body or b"{}")
            messages = request.get("messages", [])
            chunks = turn(messages)
            self.log_message(
                "%d messages, %d tool results",
                len(messages), len(tool_results(messages)))

            self.send_response(200)
            self.send_header("Content-Type", "text/event-stream")
            self.send_header("Cache-Control", "no-cache")
            self.send_header("Transfer-Encoding", "chunked")
            self.end_headers()
            for c in chunks:
                self.wfile.write(self.sse("data: " + json.dumps(c) + "\n\n"))
            self.wfile.write(self.sse("data: [DONE]\n\n"))
            self.wfile.write(b"0\r\n\r\n")
            self.wfile.flush()

        def sse(self, payload):
            raw = payload.encode()
            return b"%x\r\n%s\r\n" % (len(raw), raw)

    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-provider
  namespace: hairpin
  labels:
    app.kubernetes.io/name: fake-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-provider
    spec:
      containers:
        - name: fake-provider
          image: docker.io/library/python:3.13-alpine
          command: ["python3", "/srv/server.py"]
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: server
              mountPath: /srv
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: server
          configMap:
            name: fake-provider
---
apiVersion: v1
kind: Service
metadata:
  name: fake-provider
  namespace: hairpin
spec:
  selector:
    app.kubernetes.io/name: fake-provider
  ports:
    - port: 8080
      targetPort: http
---
# The profile that points at it, overriding the default profile the
# reference manifests ship.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hairpin-profiles
  namespace: hairpin
data:
  default.json: |
    {
      "mode": "execution",
      "provider": {
        "type": "openai-compatible",
        "baseUrl": "http://fake-provider.hairpin.svc:8080/v1",
        "apiKeyRef": "secret://FAKE_API_KEY"
      },
      "modelRouter": {"type": "static", "model": "fake-model"},
      "executor": {
        "type": "k8s",
        "network": {"mode": "none"}
      },
      "tools": {
        "controlPlane": [
          {
            "name": "search_memory",
            "description": "Search knowledge saved by earlier sessions. Call this before starting work on a task.",
            "inputSchema": {
              "type": "object",
              "properties": {
                "query": {"type": "string"},
                "limit": {"type": "integer", "description": "Maximum records to return (default 5, max 100)."}
              },
              "required": ["query"]
            }
          },
          {
            "name": "save_memory",
            "description": "Save a fact or outcome that a future session would benefit from knowing.",
            "inputSchema": {
              "type": "object",
              "properties": {
                "content": {"type": "string"},
                "kind": {"type": "string", "enum": ["event", "fact"]}
              },
              "required": ["content"]
            }
          }
        ]
      },
      "permissionPolicy": {"type": "allow-all"},
      "maxTurns": 6,
      "timeout": 300
    }
