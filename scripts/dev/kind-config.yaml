# kind cluster for hairpin's Kubernetes-native development loop.
#
# Single control-plane node: hairpin, Redis, the harness Jobs, and the
# sandbox Pods they create all share it. No gVisor RuntimeClass is
# installed — sandbox Pods run under the cluster default runtime, which
# is enough to exercise the control-plane wiring end to end.
---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hairpin
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
