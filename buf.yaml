version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # The vendored stirrup harness proto predates these rules; hairpin's
    # own proto follows them.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  ignore_only:
    # Vendored verbatim from stirrup (proto/harness/v1) so re-syncing is
    # a plain copy; the package name must stay stirrup.harness.v1 for
    # wire compatibility.
    PACKAGE_DIRECTORY_MATCH:
      - proto/harness/v1/harness.proto
breaking:
  use:
    - FILE
