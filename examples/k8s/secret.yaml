# Provider API keys for launched harness Pods, exposed via
# --k8s-env-from-secrets=provider-api-keys (envFrom on the "stirrup"
# container — internal/launcher/k8s.go). Replace the placeholder values
# below with real keys, or generate the Secret out-of-band
# (`kubectl create secret generic provider-api-keys --from-literal=...`)
# and drop this file instead of applying it.
apiVersion: v1
kind: Secret
metadata:
  name: provider-api-keys
  namespace: hairpin
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
