# hairpin itself: the JobService API, web UI, and stirrup control plane
# on one h2c port.
#
# The image, namespace, and advertise address are all defaulted — an
# in-cluster hairpin discovers its namespace from its projected
# ServiceAccount and advertises hairpin.<namespace>.svc on its listen
# port. What remains are the pieces only an operator can name: where
# Redis, Billet, and the collector runs export to are, which profiles to
# serve, and the identities the harness and its sandboxes run as.
#
# The --sandbox-token-* flags make hairpin a JWT issuer for haybale (see
# haybale.yaml): it signs a short-lived, per-run token from the mounted
# key and serves the matching JWKS. Only a profile whose executor sets
# sandbox_identity ever requests one — see profiles.yaml's "git" profile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hairpin
  namespace: hairpin
  labels:
    app.kubernetes.io/name: hairpin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hairpin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hairpin
    spec:
      serviceAccountName: hairpin
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hairpin
          image: ghcr.io/rxbynerd/hairpin:latest
          args:
            - serve
            - --redis=redis.hairpin.svc:6379
            - --profiles=/etc/hairpin/profiles
            - --harness-service-account=stirrup-harness
            - --harness-secrets=provider-api-keys
            - --sandbox-namespace=hairpin-sandboxes
            - --sandbox-service-account=stirrup-sandbox
            - --billet-addr=billet.hairpin.svc:8141
            - --sandbox-token-key=/etc/hairpin/sandbox-token/key.pem
            - --sandbox-token-issuer=https://hairpin.hairpin.svc
            - --sandbox-token-audience=https://haybale.hairpin.svc
            # Where the harness exports each run's own trace, injected
            # into a submitted RunConfig that names no trace_emitter.
            - --harness-telemetry-endpoint=steeplechase.hairpin.svc:4317
            # hairpin's own traces and metrics are a separate decision:
            # add --telemetry=otlp, and an OTEL_EXPORTER_OTLP_ENDPOINT
            # below, to export those too — steeplechase accepts them on
            # the same port. See docs/observability.md.
          env:
            # service.instance.id in exported telemetry; ignored when
            # export is off.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8130
              name: h2c
          volumeMounts:
            - name: profiles
              mountPath: /etc/hairpin/profiles
              readOnly: true
            - name: sandbox-token-key
              mountPath: /etc/hairpin/sandbox-token
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: h2c
          readinessProbe:
            httpGet:
              path: /healthz
              port: h2c
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: profiles
          configMap:
            name: hairpin-profiles
        - name: sandbox-token-key
          secret:
            secretName: hairpin-sandbox-token-key
            # Private key material gets no group/other permission bits,
            # matching the posture haybale itself requires of its own
            # mounted keys (TLS, GitHub App) — see sandbox-token.yaml.
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: hairpin
  namespace: hairpin
spec:
  selector:
    app.kubernetes.io/name: hairpin
  ports:
    - port: 8130
      targetPort: h2c
