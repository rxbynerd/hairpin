# hairpin itself: the JobService API, web UI, and stirrup control
# plane on one h2c port (internal/config.Config / cmd/hairpin/serve.go).
#
# Edit before applying:
#   - spec.template.spec.containers[0].image — build and push a hairpin
#     image, then point this at it.
#   - --k8s-image — the stirrup image the launcher runs as harness Jobs.
#   - --k8s-env-from-secrets — drop or rename if secret.yaml isn't used.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hairpin
  namespace: hairpin
  labels:
    app.kubernetes.io/name: hairpin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hairpin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hairpin
    spec:
      serviceAccountName: hairpin
      containers:
        - name: hairpin
          image: ghcr.io/rxbynerd/hairpin:latest
          args:
            - serve
            - --listen=:8130
            - --advertise=hairpin.hairpin.svc:8130
            - --redis=redis.hairpin.svc:6379
            - --launcher=k8s
            - --k8s-namespace=hairpin
            - --k8s-image=ghcr.io/rxbynerd/stirrup:latest
            - --k8s-env-from-secrets=provider-api-keys
          ports:
            - containerPort: 8130
              name: h2c
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hairpin
  namespace: hairpin
spec:
  selector:
    app.kubernetes.io/name: hairpin
  ports:
    - port: 8130
      targetPort: h2c
