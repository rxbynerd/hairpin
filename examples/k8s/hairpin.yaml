# hairpin itself: the JobService API, web UI, and stirrup control plane
# on one h2c port.
#
# The image, namespace, and advertise address are all defaulted — an
# in-cluster hairpin discovers its namespace from its projected
# ServiceAccount and advertises hairpin.<namespace>.svc on its listen
# port. What remains are the pieces only an operator can name: where
# Redis and Billet are, which profiles to serve, and the identities the
# harness and its sandboxes run as.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hairpin
  namespace: hairpin
  labels:
    app.kubernetes.io/name: hairpin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hairpin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hairpin
    spec:
      serviceAccountName: hairpin
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hairpin
          image: ghcr.io/rxbynerd/hairpin:latest
          args:
            - serve
            - --redis=redis.hairpin.svc:6379
            - --profiles=/etc/hairpin/profiles
            - --harness-service-account=stirrup-harness
            - --harness-secrets=provider-api-keys
            - --sandbox-namespace=hairpin-sandboxes
            - --sandbox-service-account=stirrup-sandbox
            - --billet-addr=billet.hairpin.svc:8141
            # Add --telemetry=otlp, and an OTEL_EXPORTER_OTLP_ENDPOINT
            # below, to export traces and metrics to a collector.
            # See docs/observability.md.
          env:
            # service.instance.id in exported telemetry; ignored when
            # export is off.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8130
              name: h2c
          volumeMounts:
            - name: profiles
              mountPath: /etc/hairpin/profiles
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: h2c
          readinessProbe:
            httpGet:
              path: /healthz
              port: h2c
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: profiles
          configMap:
            name: hairpin-profiles
---
apiVersion: v1
kind: Service
metadata:
  name: hairpin
  namespace: hairpin
spec:
  selector:
    app.kubernetes.io/name: hairpin
  ports:
    - port: 8130
      targetPort: h2c
