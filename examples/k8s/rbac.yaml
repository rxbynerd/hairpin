# RBAC for the hairpin server: the identity its launcher
# (internal/launcher/k8s.go) authenticates as when creating harness
# Jobs. Namespaced Role, not a ClusterRole — one hairpin deployment
# manages Jobs in one namespace.
#
# The harness's own identity, which needs far more, is in
# rbac-sandbox.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hairpin
  namespace: hairpin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hairpin-job-launcher
  namespace: hairpin
rules:
  - apiGroups: ["batch"]
    resources:
      - jobs
    # hairpin only creates Jobs today; get supports idempotent retry
    # diagnostics. Add list/watch/delete when a reaper lands.
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hairpin-job-launcher
  namespace: hairpin
subjects:
  - kind: ServiceAccount
    name: hairpin
    namespace: hairpin
roleRef:
  kind: Role
  name: hairpin-job-launcher
  apiGroup: rbac.authorization.k8s.io
