# haybale: the authenticating git-credential proxy sandbox Pods reach
# through hairpin's --sandbox-token-* issuer (see hairpin.yaml). haybale
# checks the sandbox's short-lived JWT against a default-deny policy and
# swaps in an upstream credential the sandbox never sees.
#
# The upstream wired in here is the development gitea from
# scripts/dev/gitea.yaml, reached through a static credential. The
# commented block below is the GitHub App upstream to add for a real
# deployment; scripts/dev/haybale-github.sh wires it into a running
# cluster. See docs/deployment.md#deploying-haybale.
#
# haybale-jwks (ConfigMap, referenced but not defined here) and
# haybale-gitea-token's real value are generated, not applied statically
# — see sandbox-token.yaml and scripts/dev/haybale.sh. The
# haybale-github-app-key Secret is optional: absent, the init container
# below copies nothing and only the gitea upstream is usable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: haybale-config
  namespace: hairpin
data:
  haybale.yaml: |
    listen: ":8466"
    logLevel: info
    # Finite so shutdown never blocks indefinitely; the default (0s) waits
    # forever for in-flight transfers to finish on their own.
    drainTimeout: 30s

    identity:
      type: jwt
      issuers:
        - issuer: https://hairpin.hairpin.svc
          # Read once at startup, not fetched over HTTP: hairpin serves its
          # JWKS over plain h2c, and jwksURL requires https except for a
          # loopback host. Key rotation (a new `hairpin keygen`) requires
          # restarting haybale to pick up the new jwks.json.
          jwksFile: /etc/haybale/jwks/jwks.json
          algorithms: [ES256]
          audiences: [https://haybale.hairpin.svc]
          typ: at+jwt
          identityTemplate: "{sub}"
          # hairpin injects a run's repo scope into this claim; it narrows
          # (never widens) the YAML policy below.
          repoScopeClaim: haybale.dev/repos

    policy:
      path: /etc/haybale/policy/policy.yaml

    upstreams:
      - host: gitea
        baseURL: http://gitea.hairpin.svc:3000
        credential:
          type: static
          username: hairpin-dev
          tokenEnv: HAYBALE_GITEA_TOKEN

      # Add this once a GitHub App exists: it mints a fresh, per-repo,
      # per-verb installation token for every request instead of one
      # static credential good for everything the policy allows. The
      # key file is what the init container copies out of the
      # haybale-github-app-key Secret.
      # - host: github.com
      #   baseURL: https://github.com
      #   credential:
      #     type: github-app
      #     appID: 123456
      #     privateKeyPath: /etc/haybale/github-app/github-app.pem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haybale-policy
  namespace: hairpin
data:
  policy.yaml: |
    # Default deny: only a rule that matches both identities and repos
    # grants anything, and only the verbs it lists.
    #
    # hairpin job IDs are "hp-<ulid>", so "hp-*" matches every run —
    # the real narrowing for a given run comes from the token's
    # repoScopeClaim (set from SubmitJobRequest.repo_scope), which can
    # only shrink what this ceiling allows, never grow it. Split this
    # into per-team or per-repo rules before relying on it beyond a
    # single-tenant dev cluster.
    rules:
      - identities: ["hp-*"]
        repos: ["gitea/*/*"]
        permissions: [read, write]
---
# Real content generated by scripts/dev/haybale.sh; kept here only as a
# placeholder so `kubectl apply -f examples/k8s/` has something to mount.
# Replace with a real token before use outside a disposable dev cluster.
apiVersion: v1
kind: Secret
metadata:
  name: haybale-gitea-token
  namespace: hairpin
type: Opaque
stringData:
  HAYBALE_GITEA_TOKEN: "REPLACE_ME"
---
# Its own identity rather than the namespace default, so a future
# RoleBinding in this namespace cannot reach haybale by accident.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haybale
  namespace: hairpin
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haybale
  namespace: hairpin
  labels:
    app.kubernetes.io/name: haybale
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haybale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haybale
    spec:
      serviceAccountName: haybale
      # haybale needs no Kubernetes API access; a credential-handling
      # proxy is exactly the workload a mounted token would make worse
      # to compromise.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      # haybale refuses a private key with any group or other permission
      # bit, and a Secret volume cannot produce an owner-only file for a
      # non-root user (fsGroup lands it at 0440). The key is copied into
      # a memory-backed emptyDir at 0600 instead, owned by the runtime
      # user. A missing Secret copies nothing.
      initContainers:
        - name: github-app-key
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              if [ -f /in/private-key.pem ]; then
                umask 077
                cp /in/private-key.pem /keys/github-app.pem
              fi
          volumeMounts:
            - name: github-app-key-in
              mountPath: /in
              readOnly: true
            - name: github-app-key
              mountPath: /keys
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: haybale
          image: ghcr.io/rxbynerd/haybale:latest
          env:
            - name: HAYBALE_GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haybale-gitea-token
                  key: HAYBALE_GITEA_TOKEN
          ports:
            - containerPort: 8466
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/haybale/haybale.yaml
              subPath: haybale.yaml
              readOnly: true
            - name: policy
              mountPath: /etc/haybale/policy
              readOnly: true
            - name: jwks
              mountPath: /etc/haybale/jwks
              readOnly: true
            - name: github-app-key
              mountPath: /etc/haybale/github-app
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # /healthz is auth-exempt and answers 503 while draining, 200
          # otherwise — see docs/configuration.md#graceful-drain in the
          # haybale checkout.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # A clone streams through this proxy, so the ceiling is
              # higher than billet's; bounded so a large fetch or a
              # request flood costs the Pod rather than the node.
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: haybale-config
        - name: policy
          configMap:
            name: haybale-policy
        - name: jwks
          # Generated together with hairpin.yaml's sandbox-token Secret
          # by `hairpin keygen` — see sandbox-token.yaml and
          # scripts/dev/haybale.sh. Not a private key, so a plain
          # ConfigMap (not a Secret) is fine.
          configMap:
            name: haybale-jwks
        - name: github-app-key-in
          secret:
            secretName: haybale-github-app-key
            optional: true
            # World-readable inside the Pod only so the non-root init
            # container can read it; the copy is what haybale opens.
            defaultMode: 0444
        - name: github-app-key
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: haybale
  namespace: hairpin
spec:
  selector:
    app.kubernetes.io/name: haybale
  ports:
    - port: 8466
      targetPort: http
---
# haybale authenticates every request, but it holds an upstream git
# credential and is resolvable from every Pod in the cluster. Sandbox
# Pods are its only client, so ingress is confined to their namespace;
# like billet's policy, this holds only on a CNI that enforces
# NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: haybale
  namespace: hairpin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: haybale
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hairpin-sandboxes
      ports:
        - protocol: TCP
          port: 8466
