# Named RunConfig templates, mounted at --profiles=/etc/hairpin/profiles.
# A submit names one (or none, taking --default-profile) and supplies
# only the prompt.
#
# The cluster coordinates of the executor are deliberately absent: a
# profile names the isolation it wants, and hairpin fills in the sandbox
# image, namespace, ServiceAccount, and RuntimeClassName from its
# --sandbox-* flags at submit time.
#
# The default profile declares the two Billet-backed memory tools
# (docs/memory.md); hairpin refuses the profile at submit unless it was
# started with --billet-addr, as the reference hairpin.yaml does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hairpin-profiles
  namespace: hairpin
data:
  default.json: |
    {
      "mode": "execution",
      "provider": {
        "type": "anthropic",
        "apiKeyRef": "secret://ANTHROPIC_API_KEY"
      },
      "modelRouter": {
        "type": "static",
        "model": "claude-sonnet-4-6"
      },
      "executor": {
        "type": "k8s",
        "network": {"mode": "none"}
      },
      "permissionPolicy": {"type": "ask-upstream", "timeout": 120},
      "tools": {
        "controlPlane": [
          {
            "name": "search_memory",
            "description": "Search knowledge saved by earlier sessions. Call this before starting work on a task.",
            "inputSchema": {
              "type": "object",
              "properties": {
                "query": {"type": "string"},
                "limit": {"type": "integer", "description": "Maximum records to return (default 5, max 100)."}
              },
              "required": ["query"]
            }
          },
          {
            "name": "save_memory",
            "description": "Save a fact or outcome that a future session would benefit from knowing.",
            "inputSchema": {
              "type": "object",
              "properties": {
                "content": {"type": "string"},
                "kind": {"type": "string", "enum": ["event", "fact"]}
              },
              "required": ["content"]
            }
          }
        ]
      },
      "maxTurns": 20,
      "timeout": 900
    }
  # A run that needs git access to a haybale-fronted host: the sandbox
  # never holds an upstream git credential, only the short-lived JWT
  # sandboxIdentity requests from hairpin's --sandbox-token-* issuer.
  # "gitea" is the routing key haybale.yaml's upstream is keyed on, not
  # a real DNS name — see docs/deployment.md#deploying-haybale.
  #
  # network.mode "none" is a dev-cluster fallback, not the intended
  # posture: it installs a genuine deny-all NetworkPolicy for the
  # sandbox Pod (stirrup's k8s executor), so it only reaches haybale on
  # a CNI that does not enforce NetworkPolicy (e.g. kind's default
  # kindnet). A NetworkPolicy-enforcing cluster needs "allowlist" mode
  # plus stirrup's own egress-proxy Deployment
  # (stirrup's examples/k8s/egress-proxy/) reachable from the sandbox
  # namespace, with haybale's host:port in its allowlist — see TODO.md
  # Wave 6 for why that is not wired up here.
  git.json: |
    {
      "mode": "execution",
      "provider": {
        "type": "anthropic",
        "apiKeyRef": "secret://ANTHROPIC_API_KEY"
      },
      "modelRouter": {
        "type": "static",
        "model": "claude-sonnet-4-6-20250514"
      },
      "executor": {
        "type": "k8s",
        "network": {"mode": "none"},
        "sandboxIdentity": {
          "source": "control-plane",
          "audience": "https://haybale.hairpin.svc"
        },
        "gitProxy": {
          "url": "http://haybale.hairpin.svc:8466",
          "hosts": ["gitea"]
        }
      },
      "permissionPolicy": {"type": "ask-upstream", "timeout": 120},
      "maxTurns": 20,
      "timeout": 900
    }
